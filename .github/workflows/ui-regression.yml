name: ui-regression

on:
  push:
    branches: [main]
  schedule:
    # 01:30 UTC = 09:30 Beijing time, every day
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Start Memos (fresh instance via Docker)
        run: |
          docker run -d --name memos \
            -p 5230:5230 \
            -v "${{ github.workspace }}/.memos-data:/var/opt/memos" \
            neosmemo/memos:stable
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5230/ > /dev/null; then
              echo "memos is up"
              exit 0
            fi
            sleep 2
          done
          echo "memos failed to start"
          docker logs memos
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run Playwright regression
        id: regression
        continue-on-error: true
        env:
          MEMOS_URL: http://127.0.0.1:5230
          MEMOS_USER: admin
          MEMOS_PASS: Memos@2026
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-results.json
        run: npx playwright test --reporter=list --reporter=html --reporter=json

      - name: Summarize failures
        if: always()
        run: node scripts/ci-summary.mjs

      - name: Fail the job if regression failed
        if: steps.regression.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            ci-results.json
          retention-days: 14
